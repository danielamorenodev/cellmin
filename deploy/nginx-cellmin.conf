# Sitio cellmin.jybora.com
# Se copia a /etc/nginx/sites-available/cellmin y se activa (ver DESPLIEGUE.md).
# Certbot agrega solo la parte HTTPS (certificado y redirección).

server {
    listen 80;
    listen [::]:80;
    server_name cellmin.jybora.com;

    # Sitio (React ya compilado)
    root /var/www/cellmin;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: se pasa al backend (uvicorn escucha solo en 127.0.0.1:8002)
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos con nombre único (js/css): se pueden guardar un año en el navegador
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El resto: si no es un archivo, se devuelve index.html (React maneja la ruta)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
