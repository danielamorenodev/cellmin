# Sitio de DEMOSTRACIÓN demo.cellmin.jybora.com (datos inventados).
# Se copia a /etc/nginx/sites-available/cellmin-demo y se activa (ver DEMO.md).
# Certbot agrega solo la parte HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name demo.cellmin.jybora.com;

    root /var/www/cellmin-demo;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Que los buscadores no indexen la demo
    add_header X-Robots-Tag "noindex, nofollow" always;

    # API de la demo (uvicorn en 127.0.0.1:8003, distinta de la del local)
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
